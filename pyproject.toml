[project]
name = "exosphere"
version = "0.1.0"
description = "A quiet feed of the people you choose on X. No algorithm, and it ends."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "twscrape[curl]>=0.20.1",
    "starlette>=0.46",
    "uvicorn>=0.34",
]

[project.scripts]
exosphere = "exosphere.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
